<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
  <title id="t">Career path of a glowing bacterium</title>
  <desc id="d">A bioluminescent Aliivibrio bacterium hops across five floating islands: biochemistry, biomedical engineering, environmental engineering, technical support and conservation technology, where it becomes a leopard's spot.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9dffd8" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#3ee6b0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3ee6b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#112338"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f8a5b"/>
      <stop offset="100%" stop-color="#3a6b45"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4a3c"/>
      <stop offset="100%" stop-color="#2e261f"/>
    </linearGradient>
    <g id="island">
      <path d="M-62 0 L62 0 L40 22 L18 44 L0 58 L-20 42 L-44 20 Z" fill="url(#rock)"/>
      <rect x="-64" y="-8" width="128" height="12" rx="6" fill="url(#grass)"/>
    </g>
  </defs>

  <style>
    .label { font: 600 13px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e8f4ee; text-anchor: middle; }
    .years { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7fd8b8; text-anchor: middle; }
    .quip { font: italic 11px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #a9bccb; text-anchor: middle; }
    .title { font: 700 17px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e8f4ee; }
    .sub { font: 12px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8fa6b8; }
    .float1 { animation: bob 4s ease-in-out infinite; }
    .float2 { animation: bob 4.6s ease-in-out infinite -1s; }
    .float3 { animation: bob 4.2s ease-in-out infinite -2s; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .twinkle { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .2; } 50% { opacity: .8; } }
  </style>

  <rect width="900" height="340" rx="16" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#cfe9ff">
    <circle class="twinkle" cx="40" cy="30" r="1.2"/>
    <circle class="twinkle" cx="210" cy="22" r="1" style="animation-delay:-1s"/>
    <circle class="twinkle" cx="400" cy="40" r="1.3" style="animation-delay:-2s"/>
    <circle class="twinkle" cx="560" cy="18" r="1" style="animation-delay:-.5s"/>
    <circle class="twinkle" cx="740" cy="34" r="1.2" style="animation-delay:-1.5s"/>
    <circle class="twinkle" cx="860" cy="70" r="1" style="animation-delay:-2.5s"/>
  </g>

  <text class="title" x="28" y="40">Applying computation to living systems</text>
  <text class="sub" x="28" y="60">a career path, as experienced by one very determined bioluminescent bacterium</text>

  <!-- dotted hop path -->
  <path d="M90 124 Q180 50 270 124 Q360 50 450 124 Q540 50 630 124 Q722 40 824 148"
        fill="none" stroke="#3ee6b0" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="3 7"/>

  <!-- ISLAND 1: Biochemistry -->
  <g class="float1"><g transform="translate(90 190)">
    <use href="#island"/>
    <!-- flask -->
    <path d="M-10 -52 L-10 -36 L-24 -12 Q-26 -8 -21 -8 L21 -8 Q26 -8 24 -12 L10 -36 L10 -52 Z" fill="#cfe7f5" fill-opacity="0.25" stroke="#cfe7f5" stroke-width="2"/>
    <path d="M-19 -18 L19 -18 L23 -11 Q24 -9 21 -9 L-21 -9 Q-24 -9 -23 -11 Z" fill="#c86bfa" fill-opacity="0.7"/>
    <circle cx="-4" cy="-26" r="2.5" fill="#c86bfa" fill-opacity="0.8">
      <animate attributeName="cy" values="-20;-50" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="5" cy="-22" r="1.8" fill="#c86bfa" fill-opacity="0.8">
      <animate attributeName="cy" values="-18;-48" dur="2.6s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.6s" begin="-1s" repeatCount="indefinite"/>
    </circle>
  </g></g>

  <!-- ISLAND 2: Biomedical Engineering -->
  <g class="float2"><g transform="translate(270 190)">
    <use href="#island"/>
    <!-- microscope -->
    <rect x="-22" y="-14" width="40" height="6" rx="2" fill="#9fb3c4"/>
    <rect x="-4" y="-48" width="9" height="30" rx="3" fill="#cdd9e3" transform="rotate(-18 0 -33)"/>
    <path d="M10 -14 Q20 -30 8 -46" fill="none" stroke="#9fb3c4" stroke-width="5" stroke-linecap="round"/>
    <rect x="-14" y="-24" width="22" height="3" rx="1.5" fill="#9fb3c4"/>
    <!-- tiny screen: CV pipeline -->
    <rect x="24" y="-44" width="30" height="22" rx="3" fill="#0d1b2a" stroke="#3ee6b0" stroke-width="1.5"/>
    <rect x="30" y="-38" width="10" height="8" fill="none" stroke="#ffcf5c" stroke-width="1.2"/>
    <circle cx="35" cy="-34" r="2" fill="#3ee6b0"/>
    <text x="39" y="-25" style="font:7px ui-monospace,Menlo,monospace;fill:#ffcf5c">0.98</text>
  </g></g>

  <!-- ISLAND 3: Environmental Engineering -->
  <g class="float3"><g transform="translate(450 190)">
    <use href="#island"/>
    <!-- gabion basket -->
    <rect x="-34" y="-26" width="30" height="18" fill="#7d7468" stroke="#c9c2b6" stroke-width="1"/>
    <path d="M-34 -17 H-4 M-24 -26 V-8 M-14 -26 V-8" stroke="#c9c2b6" stroke-width="0.8"/>
    <!-- tree -->
    <rect x="16" y="-30" width="5" height="22" fill="#6b4a32"/>
    <circle cx="18.5" cy="-38" r="14" fill="#5fae6c"/>
    <circle cx="10" cy="-32" r="9" fill="#4f9a5d"/>
    <!-- an invasive plant, being evicted -->
    <g transform="translate(36 -10)">
      <path d="M0 0 Q-3 -10 2 -16 M0 0 Q4 -8 8 -12" stroke="#b0c94a" stroke-width="2" fill="none"/>
      <animateTransform attributeName="transform" type="translate" values="36 -10; 36 -10; 46 -30; 36 -10" keyTimes="0;0.6;0.8;1" dur="3s" repeatCount="indefinite"/>
    </g>
  </g></g>

  <!-- ISLAND 4: Support -->
  <g class="float1"><g transform="translate(630 190)">
    <use href="#island"/>
    <!-- headset -->
    <path d="M-18 -22 Q-18 -50 0 -50 Q18 -50 18 -22" fill="none" stroke="#cdd9e3" stroke-width="4"/>
    <rect x="-24" y="-28" width="10" height="16" rx="4" fill="#3e7bd8"/>
    <rect x="14" y="-28" width="10" height="16" rx="4" fill="#3e7bd8"/>
    <path d="M-19 -14 Q-16 -4 -4 -6" fill="none" stroke="#cdd9e3" stroke-width="2"/>
    <circle cx="-3" cy="-6" r="2.5" fill="#3e7bd8"/>
    <!-- ticket counter -->
    <rect x="26" y="-48" width="28" height="14" rx="7" fill="#e5484d"/>
    <text x="40" y="-38" style="font:700 9px ui-sans-serif,Helvetica,Arial;fill:#fff;text-anchor:middle">359</text>
  </g></g>

  <!-- ISLAND 5: Conservation tech -->
  <g class="float2"><g transform="translate(810 190)">
    <use href="#island"/>
    <!-- camera trap on a post -->
    <rect x="-40" y="-40" width="4" height="32" fill="#6b4a32"/>
    <rect x="-46" y="-52" width="18" height="22" rx="3" fill="#5c6b3a"/>
    <circle cx="-37" cy="-43" r="4.5" fill="#0d1b2a" stroke="#c9d3a8" stroke-width="1"/>
    <circle cx="-37" cy="-34" r="1.5" fill="#e5484d">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <!-- leopard face -->
    <g transform="translate(14 -30)">
      <path d="M-15 -12 L-11 -22 L-5 -15 Z M15 -12 L11 -22 L5 -15 Z" fill="#e0a64a"/>
      <circle cx="0" cy="0" r="18" fill="#e7b25a"/>
      <ellipse cx="0" cy="7" rx="8" ry="6" fill="#f5deb0"/>
      <circle cx="-6.5" cy="-3" r="2.2" fill="#1d1a15"/>
      <circle cx="6.5" cy="-3" r="2.2" fill="#1d1a15"/>
      <path d="M-2 4 L2 4 L0 6.5 Z" fill="#6b3b2a"/>
      <!-- rosettes -->
      <g fill="none" stroke="#3a2a1a" stroke-width="1.6">
        <circle cx="-11" cy="-10" r="2.6"/>
        <circle cx="10" cy="-11" r="2.4"/>
        <circle cx="-14" cy="4" r="2.4"/>
        <circle cx="13" cy="5" r="2.6"/>
      </g>
      <!-- the empty spot, filled by our hero at the end -->
      <circle cx="0" cy="-12" r="3" fill="#3a2a1a" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.84;0.97;1" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-12" r="9" fill="url(#glow)" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.8;0.84;0.95;1" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g></g>

  <!-- captions: dim until the hero lands -->
  <g>
    <g opacity="0.35">
      <animate attributeName="opacity" values="1;1" dur="14s" repeatCount="indefinite"/>
      <text class="label" x="90" y="268">Biochemistry</text>
      <text class="years" x="90" y="284">BSc + Hons · 2017–21</text>
      <text class="quip" x="90" y="302">learned what cells are up to</text>
    </g>
    <g opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.35;1;1" keyTimes="0;0.18;0.2;1" dur="14s" repeatCount="indefinite"/>
      <text class="label" x="270" y="268">Biomedical Eng.</text>
      <text class="years" x="270" y="284">MEngSc cum laude · 2023</text>
      <text class="quip" x="270" y="302">taught a computer to watch me glow</text>
    </g>
    <g opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.35;1;1" keyTimes="0;0.36;0.38;1" dur="14s" repeatCount="indefinite"/>
      <text class="label" x="450" y="268">Environmental Eng.</text>
      <text class="years" x="450" y="284">2020–22</text>
      <text class="quip" x="450" y="302">evicted invasive plants by hand</text>
    </g>
    <g opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.35;1;1" keyTimes="0;0.54;0.56;1" dur="14s" repeatCount="indefinite"/>
      <text class="label" x="630" y="268">Support Eng.</text>
      <text class="years" x="630" y="284">2023</text>
      <text class="quip" x="630" y="302">tried turning it off and on again</text>
    </g>
    <g opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.35;1;1" keyTimes="0;0.72;0.74;1" dur="14s" repeatCount="indefinite"/>
      <text class="label" x="810" y="268">Conservation Tech</text>
      <text class="years" x="810" y="284">2023–now</text>
      <text class="quip" x="810" y="302">finally became a leopard's spot</text>
    </g>
  </g>

  <!-- THE HERO: a bioluminescent Aliivibrio -->
  <g>
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear"
      path="M90 124 Q180 50 270 124 Q360 50 450 124 Q540 50 630 124 Q722 40 824 148"
      keyPoints="0;0;0.25;0.25;0.5;0.5;0.75;0.75;1;1"
      keyTimes="0;0.06;0.18;0.24;0.36;0.42;0.54;0.6;0.72;1"/>
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.78;0.83;0.98;1" dur="14s" repeatCount="indefinite"/>
      <circle r="20" fill="url(#glow)">
        <animate attributeName="r" values="17;22;17" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <!-- flagellum -->
      <path d="M-11 0 q-5 -4 -9 0 t-9 0" fill="none" stroke="#9dffd8" stroke-width="1.6" stroke-linecap="round">
        <animate attributeName="d" values="M-11 0 q-5 -4 -9 0 t-9 0;M-11 0 q-5 4 -9 0 t-9 0;M-11 0 q-5 -4 -9 0 t-9 0" dur="0.5s" repeatCount="indefinite"/>
      </path>
      <!-- body -->
      <rect x="-12" y="-6" width="24" height="12" rx="6" fill="#c9ffe9" stroke="#3ee6b0" stroke-width="1.2"/>
      <!-- face -->
      <circle cx="4" cy="-1.5" r="1.3" fill="#0b1626"/>
      <circle cx="8" cy="-1.5" r="1.3" fill="#0b1626"/>
      <path d="M4 2 Q6 4 8 2" fill="none" stroke="#0b1626" stroke-width="1"/>
    </g>
  </g>

  <text x="872" y="328" style="font:10px ui-sans-serif,Helvetica,Arial;fill:#5d7488;text-anchor:end">Aliivibrio: really bioluminescent, really my thesis organism</text>
</svg>
